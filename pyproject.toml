[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "banna_agent"
version = "0.1.0"
description = "A from-scratch, provider-agnostic reasoning agent with a typed state substrate and verifier-guided search. Primary benchmark: GAIA."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Siavash Monfared" }]
license = { text = "MIT" }

dependencies = [
    "anthropic>=0.40",
    "openai>=1.50",
    "google-generativeai>=0.8",
    "requests>=2.31",
    "pydantic>=2.6",
    "datasets>=2.19",
    "pyyaml>=6.0",
    "beautifulsoup4>=4.12",
    "pypdf>=4.0",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "pillow>=10.0",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]
# Optional PDF-tables support. pypdf (core dep) handles text extraction;
# pdfplumber adds table-structure parsing for GAIA tasks where the
# answer lives in a PDF table. Install with `pip install ".[pdf]"`.
pdf = [
    "pdfplumber>=0.11",
]

[project.scripts]
banna-agent = "banna_agent.cli:main"
myagent = "banna_agent.cli:main"
myAgent = "banna_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "TID", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
