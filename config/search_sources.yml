version: 1
description: >
  Starter source map for the agent-facing search router. YaCy should crawl
  sources in the sources list as a curated local cache. Queries that have
  official structured APIs should route to official_api_targets instead of
  relying only on crawled pages.

defaults:
  enabled: true
  backend: yacy
  language: en
  cadence: daily
  crawl_depth: 1
  scope: domain
  max_pages_per_domain: 200
  store_cache: false
  respect_robots: true

official_api_targets:
  - id: sec_edgar
    name: SEC EDGAR
    topics: [finance, companies, filings]
    endpoint: https://data.sec.gov/submissions/
    preferred_for: [10-k, 10-q, 8-k, proxies, company_disclosures]
  - id: fred_api
    name: FRED and ALFRED
    topics: [finance, macro, economics, modeling]
    endpoint: https://fred.stlouisfed.org/docs/api/fred/
    preferred_for: [macro_time_series, vintages, releases, economic_indicators]
  - id: treasury_rates_xml
    name: U.S. Treasury Daily Rates XML
    topics: [finance, rates, macro, modeling]
    endpoint: https://home.treasury.gov/resource-center/data-chart-center/interest-rates/pages/xml
    preferred_for: [treasury_yield_curve, bill_rates, real_yields, long_term_rates]
  - id: bls_api
    name: Bureau of Labor Statistics API
    topics: [finance, macro, labor, economics, modeling]
    endpoint: https://www.bls.gov/developers/
    preferred_for: [cpi, payrolls, unemployment, wages, labor_time_series]
  - id: bea_api
    name: Bureau of Economic Analysis API
    topics: [finance, macro, economics, modeling]
    endpoint: https://apps.bea.gov/api/
    preferred_for: [gdp, pce, national_accounts, regional_accounts]
  - id: eia_api
    name: U.S. Energy Information Administration API
    topics: [finance, commodities, energy, macro, modeling]
    endpoint: https://www.eia.gov/opendata/
    preferred_for: [oil, gas, electricity, energy_prices, inventories]
  - id: cftc_cot
    name: CFTC Commitments of Traders
    topics: [finance, futures, positioning, modeling]
    endpoint: https://www.cftc.gov/MarketReports/CommitmentsofTraders/index.htm
    preferred_for: [futures_positioning, leveraged_funds, asset_managers, managed_money]
  - id: pubmed_ncbi
    name: PubMed and NCBI E-utilities
    topics: [science, biomedicine, papers]
    endpoint: https://eutils.ncbi.nlm.nih.gov/entrez/eutils/
    preferred_for: [biomedical_literature, abstracts, mesh]
  - id: clinicaltrials
    name: ClinicalTrials.gov
    topics: [science, biomedicine, clinical_trials]
    endpoint: https://clinicaltrials.gov/data-api/api
    preferred_for: [trial_status, interventions, conditions, sponsors]
  - id: openfda
    name: openFDA
    topics: [science, health, regulation]
    endpoint: https://api.fda.gov/
    preferred_for: [drug_labels, adverse_events, recalls, device_events]
  - id: wikipedia_mediawiki
    name: Wikipedia and MediaWiki
    topics: [reference, encyclopedia]
    endpoint: https://www.mediawiki.org/wiki/API:Main_page
    preferred_for: [encyclopedia_facts, entity_summaries]
  - id: openalex
    name: OpenAlex
    topics: [science, scholarly]
    endpoint: https://api.openalex.org/
    preferred_for: [scholarly_graph, authors, institutions, works]
  - id: crossref
    name: Crossref
    topics: [science, scholarly]
    endpoint: https://api.crossref.org/
    preferred_for: [doi_metadata, publication_metadata]
  - id: arxiv_api
    name: arXiv API
    topics: [science, ai, scholarly]
    endpoint: https://export.arxiv.org/api/query
    preferred_for: [preprints, ai_research, physics, quantitative_biology]
  - id: federal_register_api
    name: Federal Register API
    topics: [government, regulation]
    endpoint: https://www.federalregister.gov/developers/documentation/api/v1
    preferred_for: [rules, proposed_rules, notices, agency_documents]
  - id: govinfo_api
    name: govinfo API
    topics: [government, legislation, records]
    endpoint: https://api.govinfo.gov/docs/
    preferred_for: [congressional_records, bills, statutes, federal_documents]
  - id: congress_api
    name: Congress.gov API
    topics: [government, legislation]
    endpoint: https://api.congress.gov/
    preferred_for: [bills, amendments, members, committees]
  - id: usaspending_api
    name: USAspending API
    topics: [government, finance, grants, contracts]
    endpoint: https://api.usaspending.gov/
    preferred_for: [federal_awards, grants, contracts, recipients]

